[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-clinic-voice-agent"
version = "0.1.0"
description = "Inbound (Clara) and outbound (Clara) voice agent for Demo Eye and Retina Clinic, built on LiveKit Agents"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[anthropic,cartesia,deepgram,elevenlabs,google,openai,sarvam,silero,xai]~=1.8",
    "livekit-plugins-ai-coustics~=0.3",
    "pydantic>=2.7",
    "python-dotenv",
    "pyyaml>=6",
    "tzdata; sys_platform == 'win32'",  # Windows has no system timezone database
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff",
]

[tool.uv]
# carried over from the LiveKit starter: yarl 1.24.1 shipped without a 3.11+ wheel
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = "-m 'not live'"   # live LLM evals: `uv run pytest -m live`
pythonpath = ["src", "."]
markers = [
    "live: needs real provider API keys (skipped when keys are missing)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # Hindi/Devanagari text in prompts is intentional

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
