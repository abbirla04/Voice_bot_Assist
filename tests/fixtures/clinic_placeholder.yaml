# TEST FIXTURE: the old sample clinic (fake doctors, fees and slot timings).
# The unit/flow tests use it to exercise the slot-booking mode; the bot itself
# runs on config/clinic.yaml (the demo clinic, appointment-request mode).
#
# Everything the bot is allowed to say about the clinic lives here.
# The bot never invents doctors, fees, timings or numbers: if it is not in this
# file (or returned by the scheduling backend), it says it will find out / call back.
#
# !!! PLACEHOLDER DATA !!!
# Doctors, locations, fees, slot timings and department phone numbers below are
# NOT any clinic's real data. They exist so the bot can be tested end to end.
# `placeholder_data: true` makes the agent refuse to run in production mode
# (`python src/agent.py start`) unless ALLOW_PLACEHOLDER_DATA=1 is set.
placeholder_data: true

clinic:
  name: "Sample Eye Clinic"
  timezone: "Asia/Kolkata"
  # Closing lines: one after a booking, one for any other inbound call, one outbound.
  booking_closing_line: "Thank you for choosing Sample Eye Clinic for your treatment. You were speaking with {persona}. Wish you a lovely day ahead."
  closing_line: "Thank you for calling Sample Eye Clinic. You were speaking with {persona}. Wish you a lovely day ahead."
  outbound_closing_line: "Thank you for your time and for connecting with Sample Eye Clinic. You were speaking with {persona}. Wish you a lovely day ahead."
  # Say "virtual assistant" in the greeting. The bot will ALWAYS admit it is an AI
  # if asked, regardless of this flag.
  disclose_ai_in_greeting: true
  consultation:
    # spoken in the confirmation: "The consultation takes <this>, so please plan your day."
    # (script: "approximately one to three hours covering vision analysis, work-up,
    # consultation and any further investigations if required")
    duration_text: "about one to three hours, including vision analysis, work-up and consultation"
    includes_registration: true
  dilation_advice: >-
    If your eyes are dilated, you will not be able to drive back on your own, so
    please bring someone along, who can also help you understand the doctor's prescription.
  sms_confirmation: true

personas:
  inbound:
    name: "Clara"
  outbound:
    name: "Clara"

