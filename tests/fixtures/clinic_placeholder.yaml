# Warm-transfer targets. `sip_call_to` is dialled through your Exotel outbound
# trunk (LIVEKIT_SIP_OUTBOUND_TRUNK). Leave it empty to disable that department;
# the bot will then offer a callback instead of transferring.
departments:
  - id: "appointments"
    name: "Appointments desk"
    handles: "rescheduling or cancelling existing appointments, group or corporate bookings, anything the bot cannot book itself"
    sip_call_to: ""
    hours: { days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], start: "09:00", end: "19:00" }
  - id: "billing"
    name: "Billing and insurance (TPA)"
    handles: "bills already raised, refunds, insurance, cashless or TPA approvals"
    sip_call_to: ""
    hours: { days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], start: "09:30", end: "18:00" }
  - id: "surgery-counselling"
    name: "Surgery counselling"
    handles: "surgery costs and packages, cataract, LASIK, retina or other surgery planning, lens options, surgery dates"
    sip_call_to: ""
    hours: { days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], start: "09:30", end: "18:00" }
  - id: "reports"
    name: "Medical records and reports"
    handles: "test reports, discharge summaries, prescriptions, medical certificates"
    sip_call_to: ""
    hours: { days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], start: "10:00", end: "17:00" }
  - id: "optical"
    name: "Optical store"
    handles: "spectacles, contact lenses, frame orders and deliveries"
    sip_call_to: ""
    hours: { days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], start: "10:00", end: "19:00" }
  - id: "emergency"
    name: "Emergency desk"
    handles: "eye injury, chemical splash, sudden loss of vision, severe eye pain, problems after surgery"
    sip_call_to: ""
    hours: { days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], start: "00:00", end: "23:59" }

# Emergency red flags. On any of these the bot stops the booking flow, gives the
# advice below and offers an immediate transfer to the emergency desk.
# (sample wording)
emergency:
  red_flags:
    - "sudden loss or sudden drop of vision in one or both eyes"
    - "chemical, acid or lime (chuna) splash in the eye"
    - "injury to the eye, something stuck in or hit the eye"
    - "severe eye pain, especially with headache, nausea or vomiting"
    - "a curtain or shadow over the vision, or a sudden shower of floaters and flashes"
    - "severe pain, redness, discharge or drop in vision after eye surgery"
  advice: >-
    This needs urgent attention. Please go to the nearest eye emergency or
    hospital emergency right away. For a chemical splash, keep rinsing the eye
    with plenty of clean running water while someone takes you there. Do not rub
    the eye.
  # Spoken after the advice when live transfer to the emergency desk is not possible.
  # Put the real 24x7 emergency number / centre here. Empty = not spoken.
  contact_line: ""

# Hold SOP ("Scripts for Holding the call").
hold:
  # Only announce a hold if a lookup is still running after this many seconds.
  first_notice_after_s: 2.0
  # Keep informing the caller during the hold.
  checkin_every_s: 20.0
  # Never hold more than a minute; after this, offer a callback.
  max_hold_s: 60.0
  music_volume: 0.25

# Transfer SOP ("Script for transferring the call").
transfer:
  # Ring the colleague this long before coming back to the caller.
  ringing_timeout_s: 25.0

# Outbound calls.
outbound:
  # Do not dial outside these local hours.
  calling_window: { start: "09:00", end: "21:00" }
  ring_timeout_s: 40.0

# Call safety limits.
limits:
  max_call_minutes: 15
  # After the caller goes silent: how many "are you there?" prompts before hanging up.
  silence_prompts_before_hangup: 2
